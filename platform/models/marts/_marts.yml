version: 2

# ─────────────────────────────────────────────────────────────────────────────
# dbt Mesh — Public interface of the platform project (Fusion-conformant).
#
# Fusion enforcement:
#  - contract: enforced: true on ALL public models (required for Mesh)
#  - All data_type values use Databricks/Fusion type names
#  - Generic test arguments nested under arguments: key
#  - No :: cast syntax anywhere in this project
# ─────────────────────────────────────────────────────────────────────────────

models:

  - name: time_spine_daily
    description: A time spine with one row per day, ranging from 5 years in the past to 30 days into the future.
    time_spine:
      standard_granularity_column: date_day  # The base column used for time joins
    columns:
      - name: date_day
        description: The base date column for daily granularity
        granularity: day
  
  - name: dim_customers
    description: >
      PUBLIC model. Customer dimension with LTV metrics and segmentation. Consumed by:
      marketing (segmentation), finance (revenue attribution), and the pinned Semantic
      Layer bridge. Contract enforced — column changes are breaking for consumers.
    latest_version: 1
    versions:
      - v: 1
        defined_in: dim_customers
    config:
      group: platform_core
      access: public
      latest_version_pointer:
        enabled: true
      contract:
        enforced: true
    columns:
      - name: customer_id
        description: "Unique customer identifier. Primary key."
        data_type: integer
        constraints:
          - type: not_null
          - type: primary_key
        tests:
          - not_null
          - unique

      - name: first_name
        description: "Customer first name."
        data_type: string

      - name: last_name
        description: "Customer last name."
        data_type: string

      - name: email
        description: "Lowercased customer email address."
        data_type: string
        constraints:
          - type: not_null
        tests:
          - not_null

      - name: created_date
        description: "Date the customer account was created."
        data_type: date

      - name: country
        description: "Uppercased two-letter ISO country code."
        data_type: string

      - name: number_of_orders
        description: "Total number of orders placed by this customer, regardless of status."
        data_type: bigint

      - name: total_lifetime_value
        description: "Sum of all successful payment amounts for this customer (USD)."
        data_type: decimal(18,2)

      - name: first_order_date
        description: "Date of the customer's first order."
        data_type: date

      - name: most_recent_order_date
        description: "Date of the customer's most recent order."
        data_type: date

      - name: customer_segment
        description: >
          Derived value tier based on total_lifetime_value.
          high_value: >= $500 | mid_value: $100–$499 | low_value: < $100.
          Tested with accepted_values — only these three values can exist.
        data_type: string
        tests:
          - accepted_values:
              arguments:
                values: ['high_value', 'mid_value', 'low_value']


  - name: dim_products
    description: >
      PUBLIC model. Product catalog dimension. Consumed by: finance (revenue by product/category). Contract enforced.
       Semantic model built on dim_products. One row per product. Defines the product grain, category dimension, and pricing measures. This is the authoritative definition of a "product" for all BI and Genie queries.
    latest_version: 1
    versions:
      - v: 1
        defined_in: dim_products
      - v: 2
        defined_in: dim_products_v2
        columns:
          - include: all
            exclude: [product_name]
          - name: product_display_name
            description: "Human-readable product name. Renamed from product_name in v1."
            data_type: string
            constraints:
              - type: not_null
    config:
      group: platform_core
      access: public
      latest_version_pointer:
        enabled: true
      contract:
        enforced: true
    columns:

      - name: product_id
        description: "Unique product identifier. Primary key."
        data_type: integer
        constraints:
          - type: not_null
          - type: primary_key
        tests:
          - not_null
          - unique

        entity:
          type: primary
          name: product
      - name: product_name
        description: "Human-readable product name."
        data_type: string
        constraints:
          - type: not_null

      - name: category
        description: "Lowercased product category (apparel, electronics, fitness, footwear, nutrition)."
        data_type: string

        dimension:
          type: categorical
      - name: unit_price
        description: "Current list price in USD."
        data_type: decimal(18,2)

      - name: is_active
        description: "True if the product is currently available for purchase."
        data_type: boolean

    semantic_model:
      enabled: true
      name: dim_products
    derived_semantics:
      entities: []
      dimensions:
        - name: is_active
          type: categorical
          expr: cast(is_active as string)
  - name: fct_orders
    description: >
      PUBLIC model. Order fact table enriched with item counts and payment totals.
      Consumed by finance, marketing, and the pinned Semantic Layer bridge. Contract
      enforced — this is the canonical order grain for downstream consumers.
    latest_version: 1
    versions:
      - v: 1
        defined_in: fct_orders
    config:
      group: platform_core
      access: public
      latest_version_pointer:
        enabled: true
      contract:
        enforced: true
    columns:
      - name: order_id
        description: "Unique order identifier. Primary key."
        data_type: integer
        constraints:
          - type: not_null
          - type: primary_key
        tests:
          - not_null
          - unique

      - name: customer_id
        description: "Foreign key to dim_customers."
        data_type: integer
        constraints:
          - type: not_null
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers', v=1)
                field: customer_id

      - name: order_date
        description: "Date the order was placed."
        data_type: date
        constraints:
          - type: not_null
        tests:
          - not_null

      - name: status
        description: "Order lifecycle status. Valid values: placed, shipped, completed, returned."
        data_type: string
        tests:
          - accepted_values:
              arguments:
                values: ['placed', 'shipped', 'completed', 'returned']

      - name: payment_method
        description: "Payment method used: credit_card, paypal, bank_transfer."
        data_type: string

      - name: number_of_items
        description: "Number of distinct line items in the order."
        data_type: bigint

      - name: items_total
        description: "Sum of (quantity * unit_price) for all line items in the order (USD)."
        data_type: decimal(18,2)

      - name: amount_paid
        description: >
          Total amount successfully paid for this order (USD).
          Counts only payments with status = 'success'.
          This is NOT the same as order amount — returns and failed payments are excluded.
        data_type: decimal(18,2)
        tests:
          - not_null
